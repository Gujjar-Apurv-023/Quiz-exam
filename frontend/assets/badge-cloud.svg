<svg xmlns="http://www.w3.org/2000/svg" width="130" height="20" viewBox="0 0 130 20" author="Apurv Gujjar" copyright="Copyright © 2026 Apurv Gujjar">
  <!-- Author: Apurv Gujjar (apurv-gujjar.me) | AWS Certified Developer - Associate -->
  <desc>Author: Apurv Gujjar (apurv-gujjar.me) | AWS Certified Developer - Associate</desc>
  <defs>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b">
        <animate attributeName="stop-color" values="#f59e0b; #3b82f6; #f97316; #f59e0b" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f97316">
        <animate attributeName="stop-color" values="#f97316; #f59e0b; #3b82f6; #f97316" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <style>
      .txt {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 10px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 0.3px;
        text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.4);
      }
    </style>
  </defs>
  <rect width="130" height="20" rx="4" fill="url(#cloud-grad)" />
  <rect x="0.5" y="0.5" width="129" height="19" rx="3.5" fill="none" stroke="#ffffff" stroke-opacity="0.3" />
  <text x="65" y="14" class="txt" text-anchor="middle">☁️ Cloud Guide</text>
  
  <!-- Visible E-Signature -->
  <text x="127" y="18" text-anchor="end" font-family="sans-serif" font-size="4.5" fill="#ffffff" opacity="0.25">© AWS Certified Developer - Associate • Author: Apurv Gujjar</text>
</svg>
